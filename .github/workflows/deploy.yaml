name: Deploy Book to GitHub Pages

on:
  push:
    branches: [ "master" ] # Или master, если у тебя такая ветка

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Устанавливаем mdBook
      - name: Install mdBook
        run: cargo install mdbook

      # Собираем книгу (создаст папку _build)
      - name: Build Book
        run: mdbook build

      # Деплоим на GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          cname: parserpro.github.io # Если есть домен, иначе можно убрать эту строку
